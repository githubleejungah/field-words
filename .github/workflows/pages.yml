# 필드워드 검사 + 게임 받기 · 검사 → 모두 통과하면 필드워드 site/ 와 게임 site/(→ game/)를 한 묶음으로 GitHub Pages에 배포
# 하나라도 실패하면 배포하지 않는다. 지난 사이트(게임 포함)가 그대로 남는다 (AC-110).
# 게임 코드의 정본은 게임 저장소(field-words-3d-lab)다. 여기서는 받아서 검사하고 넣기만 한다 (ADR-0006, AC-105).
name: 검사 후 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"    # 매일 한국 06:00 (UTC 21:00). 게임만 고친 날도 다음 아침에 반영 (AC-104)
  workflow_dispatch:        # GitHub 화면에서 손으로 다시 실행할 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ① 필드워드 검사
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: 데이터 검사 (스키마 + 참조)
        run: python pipeline/validate.py
      - name: 파이프라인 시험 (AI 답 검수 검사 · 다시 확인할 날)
        run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 복습 규칙 단위 테스트
        run: node --test tests/review.test.js
      - name: 화면 코드 문법 검사 (글자 하나 잘못돼도 앱 전체가 안 뜨는 것을 막는다)
        run: node --check site/js/app.js && node --check site/js/review.js

      # ② 게임 받기: 공개 저장소라 비밀 키가 필요 없다. 공개 점검이 지난 커밋까지 보므로 기록 전체를 받는다 (AC-102)
      - name: 게임 받기 (field-words-3d-lab main 최신)
        uses: actions/checkout@v4
        with:
          repository: githubleejungah/field-words-3d-lab
          ref: main
          path: game-src
          fetch-depth: 0
      - name: 받은 게임 커밋 기록
        working-directory: game-src
        run: git log -1 --format="게임 커밋 %h %cs %s"

      # ③ 게임 검사 4가지: 게임 저장소의 pages.yml과 같다 (AC-103).
      #    문제 검사는 같은 작업 안의 필드워드 사전으로 용어 · 등급까지 본다.
      - name: "게임 ① 공개 점검 (비밀 값 모양이 1개라도 있으면 멈춤)"
        working-directory: game-src
        run: node tools/check_public.mjs --no-report
      - name: "게임 ② 문제 · 실전 읽기 · 파이썬 연습 검사"
        working-directory: game-src
        run: node tools/check_problems.mjs --glossary ../site/data/glossary.json
      - name: "게임 ③ 단위 시험"
        working-directory: game-src
        run: node --test tests/
      - name: "게임 ④ 화면 코드 문법 검사"
        working-directory: game-src
        run: for f in site/js/*.js; do node --check "$f"; done

      # ④ 합치기: 필드워드 site/ + 게임 site/ → _site/game/. 필드워드 저장소에는 아무것도 커밋하지 않는다 (AC-101 · AC-105)
      - name: 필드워드와 게임을 한 묶음으로
        run: |
          cp -r site _site
          cp -r game-src/site _site/game
          rm -rf _site/game/py/__pycache__
          ls _site _site/game

      # 검사를 통과한 묶음을 여기서 올려 둔다. 올리기와 배포를 같은 작업에서 연달아 하면
      # 배포 단계가 방금 올린 파일을 못 찾는 일이 생긴다(2026-11-24 "No artifacts named github-pages").
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
