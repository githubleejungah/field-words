# main에 올릴 때마다: 데이터 검사 + 복습 규칙 시험 → 통과하면 site/ 폴더만 GitHub Pages로 배포
# 검사가 실패하면 배포하지 않는다 (틀린 데이터가 수강생에게 나가지 않게)
name: 검사 후 배포

on:
  push:
    branches: [main]
  workflow_dispatch:        # GitHub 화면에서 손으로 다시 실행할 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: 데이터 검사 (스키마 + 참조)
        run: python pipeline/validate.py
      - name: 파이프라인 시험 (AI 답 검수 검사 · 다시 확인할 날)
        run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 복습 규칙 단위 테스트
        run: node --test tests/review.test.js
      - name: 화면 코드 문법 검사 (글자 하나 잘못돼도 앱 전체가 안 뜨는 것을 막는다)
        run: node --check site/js/app.js && node --check site/js/review.js
      # 검사를 통과한 site/ 폴더를 여기서 올려 둔다. 올리기와 배포를 같은 작업에서 연달아 하면
      # 배포 단계가 방금 올린 파일을 못 찾는 일이 생긴다(2026-11-24 "No artifacts named github-pages").
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
