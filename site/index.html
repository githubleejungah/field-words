<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- v0.1은 링크를 아는 수강생만 본다. 검색 엔진에 뜨지 않게 한다. 넓게 공개할 때 지운다. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="예문으로 익히는 FDE 실무 용어">
  <meta name="theme-color" content="#3f6b57">
  <title>필드워드 Field Words</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <!-- 맨 위 막대는 화면마다 app.js가 그린다: 목록은 앱 이름을 크게, 카드는 한 줄로 작게 -->
    <header class="topbar" id="topbar"></header>

    <!-- 화면 내용은 app.js가 주소(#/...)에 따라 이 자리에 그린다 -->
    <main id="app" aria-live="polite">
      <p class="muted">불러오는 중…</p>
    </main>

    <!-- 정보 화면은 필요한 사람만 찾아서 보도록 맨 아래에 둔다 -->
    <footer class="footer">
      <a href="#/about">정보 · 의견 보내기</a>
    </footer>
  </div>

  <!-- review.js(학습 기록 규칙)를 먼저 불러야 app.js(화면)가 쓸 수 있다 -->
  <script src="js/review.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
